controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    # as the controller server takes the robot's odometry to know how the robot is moving
    # below 3 params indicate the min velocities alogn the x and y axis that are considered valid movements and not just sensor noise
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5 # we don't expect any movement along the y-axis
    min_theta_velocity_threshold: 0.001

    failure_tolerance: 0.3

    odom_topic: /robot_controller/odom # what happens if we use /odometry/filtered instead??
    progress_checker_plugin: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath", "Custom1", "Custom2"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5 # min amount the robot must move in order to be considered that it is progressing towards the goal
      movement_time_allowance: 10.0 # sec
    # Goal checker parameters
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: True

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.3
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 1.8
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 1.0
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 1.0
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 3.2
      max_robot_pose_search_dist: 10.0
      interpolate_curvature_after_goal: false
      cost_scaling_dist: 0.3
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0


    # PD Motion Planner parameters
    Custom1:
      plugin: "robot_motion::PDMotionPlannerPlugin"
      kp: 2.0
      kd: 0.1
      max_linear_velocity: 0.3
      max_angular_velocity: 1.0
      step_size: 0.1

    # Pure Pursuit parameters
    Custom2:
      plugin: "robot_motion::PurePursuitPlugin"
      look_ahead_distance: 0.5
      max_linear_velocity: 0.3
      max_angular_velocity: 1.0


local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: true
      rolling_window: true
      width: 3
      height: 3
      robot_radius: 0.27
      resolution: 0.05
      always_send_full_costmap: true

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan # "source1 source2"
        scan:
          topic: /scan
          data_type: "LaserScan"
          max_obstacle_height: 2.0
          marking: true
          clearing: true
          combination_method: 1
          raytrace_min_range: 0.0
          raytrace_max_range: 3.0
          obstacle_min_range: 0.0
          obstacle_max_range: 2.5

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        # radius to inflate costmap around lethal obstacles. Totla size of inflation around obstacles. Includes the robot's footprint (lethal areas) + certain area aound the lethal obstacles (area not recommended for navigation)
        # has to be >= robot_radius
        inflation_radius: 0.55 # of which first 0.27 will be the robot's radius; having it too high can result is failure in finiding a path. Or maybe need to change < 99 to < 252
        cost_scaling_factor: 3.0