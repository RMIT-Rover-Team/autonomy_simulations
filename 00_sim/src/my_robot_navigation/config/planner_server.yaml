planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased", "Custom1", "Custom2"]

    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D" # nav2_smac_planner/SmacPlanner2D
      tolerance: 0.125                      # tolerance for planning if unable to reach exact pose, in meters
      downsample_costmap: false             # whether or not to downsample the map
      downsampling_factor: 1                # multiplier for the resolution of the costmap layer (e.g. 2 on a 5cm costmap would be 10cm)
      allow_unknown: true                   # allow traveling in unknown space
      max_iterations: 1000000               # maximum total iterations to search for before failing (in case unreachable), set to -1 to disable
      max_on_approach_iterations: 1000      # maximum number of iterations to attempt to reach goal once in tolerance
      max_planning_time: 2.0                # max time in s for planner to plan, smooth
      cost_travel_multiplier: 2.0           # Cost multiplier to apply to search to steer away from high cost areas. Larger values will place in the center of aisles more exactly (if non-`FREE` cost potential field exists) but take slightly longer to compute. To optimize for speed, a value of 1.0 is reasonable. A reasonable tradeoff value is 2.0. A value of 0.0 effective disables steering away from obstacles and acts like a naive binary search A*.
      use_final_approach_orientation: false # Whether to set the final path pose at the goal's orientation to the requested orientation (false) or in line with the approach angle so the robot doesn't rotate to heading (true)
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10


    Custom1:
      plugin: "robot_planning::DijkstraPlannerPlugin"

    Custom2:
      plugin: "robot_planning::AStarPlannerPlugin"

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: true
      robot_radius: 0.27
      resolution: 0.05
      always_send_full_costmap: true
      track_unknown_space: true

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"] # order matters

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan # "source1 source2"
        scan:
          topic: /scan
          data_type: "LaserScan"
          max_obstacle_height: 2.0
          marking: true
          clearing: true
          combination_method: 1
          raytrace_min_range: 0.0
          raytrace_max_range: 3.0
          obstacle_min_range: 0.0
          obstacle_max_range: 2.5

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        # radius to inflate costmap around lethal obstacles. Totla size of inflation around obstacles. Includes the robot's footprint (lethal areas) + certain area aound the lethal obstacles (area not recommended for navigation)
        # has to be >= robot_radius
        inflation_radius: 0.55 # of which first 0.27 will be the robot's radius; having it too high can result is failure in finiding a path. Or maybe need to change < 99 to < 252
        cost_scaling_factor: 3.0